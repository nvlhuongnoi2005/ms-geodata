server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /auth/ {
    proxy_pass http://controller.webgis.svc.cluster.local:3001;
    proxy_http_version 1.1;
    # Map Auth only accepts its configured WebGIS origin. The browser calls this
    # same-origin proxy; do not forward an arbitrary browser Origin upstream.
    proxy_set_header Origin http://webgis.localhost;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

