apiVersion: apps/v1
kind: Deployment
metadata:
  name: geodata-frontend
  namespace: tile-server
  labels:
    app.kubernetes.io/name: geodata-frontend
    app.kubernetes.io/part-of: tile-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: geodata-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: geodata-frontend
        app.kubernetes.io/part-of: tile-server
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: frontend
          image: ghcr.io/nvlhuongnoi2005/tile-server/front-end:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: geodata-frontend
  namespace: tile-server
  labels:
    app.kubernetes.io/name: geodata-frontend
    app.kubernetes.io/part-of: tile-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: geodata-frontend
  ports:
    - name: http
      port: 80
      targetPort: http

