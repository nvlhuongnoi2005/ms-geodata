# Copy this file to ceph-s3-credentials.yaml, populate values outside Git,
# then apply it before the buckets bootstrap Job.
apiVersion: v1
kind: Secret
metadata:
  name: geodata-ceph-s3
  namespace: tile-server
  labels:
    app.kubernetes.io/part-of: tile-server
type: Opaque
stringData:
  S3_ENDPOINT: https://ceph-rgw.example.internal
  S3_REGION: us-east-1
  S3_ACCESS_KEY: replace-me
  S3_SECRET_KEY: replace-me
  S3_RAW_BUCKET: geodata-raw
  S3_DERIVED_BUCKET: geodata-derived
  S3_STYLES_BUCKET: geodata-styles

